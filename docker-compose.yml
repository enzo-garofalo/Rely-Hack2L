services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opero}
      POSTGRES_USER: ${POSTGRES_USER:-opero}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opero}
    ports:
      - "5432:5432"
    volumes:
      - opero_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opero}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: python manage.py runserver 0.0.0.0:8000

  # WhatsApp real (E10, enhancement). Serviço separado de propósito: o
  # Chromium do whatsapp-web.js é a parte mais frágil do stack e não pode
  # levar o backend junto se cair. Nada depende dele — derrubar este
  # container mantém a jornada simulada 100% funcional, que é a regra de
  # segurança da demo.
  whatsapp-gateway:
    build:
      context: ./whatsapp-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OPERO_API_URL: http://backend:8000/api
      WHATSAPP_SESSION_PATH: /app/.wwebjs_auth
    ports:
      - "${WHATSAPP_GATEWAY_PORT:-3001}:3001"
    depends_on:
      - backend
    volumes:
      # Sessão do LocalAuth: é o que evita reescanear o QR a cada restart.
      - opero_wwebjs_auth:/app/.wwebjs_auth

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev

volumes:
  opero_pgdata:
  opero_wwebjs_auth:
